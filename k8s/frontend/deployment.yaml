apiVersion: apps/v1
kind: Deployment
metadata:
  name: rebuy-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rebuy-frontend
  template:
    metadata:
      labels:
        app: rebuy-frontend
    spec:
      containers:
      - name: angular-frontend
        image: kawsarz/rebuy-frontend:latest  # ✅ FIXED: Added your username
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_URL
          value: "http://rebuy-backend-service:8080"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /index.html  # Direct file check for liveness
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 10
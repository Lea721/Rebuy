<!-- Signup Page -->
<div class="signup-page">
  <div class="signup-container">
    <div class="signup-card">
      <div class="signup-header">
        <h1 class="signup-title">Create an account</h1>
        <p class="signup-subtitle">Join Rebuy and start shopping sustainably</p>
      </div>
      
      <form class="signup-form" (ngSubmit)="onSubmit()" #signupForm="ngForm">
        <!-- Error Message -->
        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="form-group">
          <label for="name" class="form-label">Name *</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            class="form-input" 
            placeholder="John Doe"
            [(ngModel)]="registerData.name"
            required
            #nameInput="ngModel"
          >
          <div class="field-error" *ngIf="nameInput.invalid && nameInput.touched">
            Name is required
          </div>
        </div>
        
        <div class="form-group">
          <label for="email" class="form-label">Email *</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="you@example.com"
            [(ngModel)]="registerData.email"
            required
            #emailInput="ngModel"
          >
          <div class="field-error" *ngIf="emailInput.invalid && emailInput.touched">
            Valid email is required
          </div>
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">Phone</label>
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            class="form-input" 
            placeholder="(optional)"
            [(ngModel)]="registerData.phone"
          >
        </div>

        <div class="form-group">
          <label for="city" class="form-label">City</label>
          <input 
            type="text" 
            id="city" 
            name="city" 
            class="form-input" 
            placeholder="(optional)"
            [(ngModel)]="registerData.city"
          >
        </div>

        <div class="form-group">
          <label for="shippingAddress" class="form-label">Shipping Address</label>
          <input 
            type="text" 
            id="shippingAddress" 
            name="shippingAddress" 
            class="form-input" 
            placeholder="(optional)"
            [(ngModel)]="registerData.shippingAddress"
          >
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Password *</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="Minimum 8 characters"
            [(ngModel)]="registerData.password"
            required
            minlength="8"
            #passwordInput="ngModel"
          >
          <div class="field-error" *ngIf="passwordInput.invalid && passwordInput.touched">
            Password must be at least 8 characters
          </div>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password *</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            class="form-input"
            placeholder="Confirm your password"
            [(ngModel)]="confirmPassword"
            required
            #confirmPasswordInput="ngModel"
          >
          <div class="field-error" *ngIf="confirmPasswordInput.invalid && confirmPasswordInput.touched">
            Please confirm your password
          </div>
          <div class="field-error" *ngIf="confirmPassword && registerData.password !== confirmPassword">
            Passwords do not match
          </div>
        </div>
        
        <button 
          type="submit" 
          class="btn-signup"
          [disabled]="isLoading || signupForm.invalid || registerData.password !== confirmPassword"
        >
          <span *ngIf="!isLoading">Sign Up</span>
          <span *ngIf="isLoading">Creating account...</span>
        </button>
        
        <div class="signup-footer">
          <p class="login-link">
            Already have an account? 
            <a routerLink="/login" class="link">Login</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>

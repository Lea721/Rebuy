spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.qhrszjbdeipydpagoyii
spring.datasource.password=RebuyProject12

# JPA / Hibernate
#Hibernate = the system that converts Java objects to database tables.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP settings: lower pool size to avoid hitting Supabase pooler limits
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=30000

# Explicit dialect so Hibernate can start even if metadata is delayed
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Disable Flyway migrations if the production DB cannot run migrations automatically
spring.flyway.enabled=false


version: "3.9"
 
# ======================================================
# Rebuy Application – Docker Compose Stack
# Database is hosted externally on Supabase (PostgreSQL).
# No local DB container is required.
# ======================================================
 
services:
  backend:
    container_name: rebuy-backend
    build:
      context: ./Rebuy-backend-with-tests/backend
    ports:
      - "8080:8080"
 
    # Database credentials and configuration are injected
    # securely via environment variables (.env file)
    env_file:
      - .env
 
    # Healthcheck used for service readiness and startup ordering
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
 
    # Persistent volume for backend logs or runtime data
    volumes:
      - backend-logs:/app/logs
 
    networks:
      - rebuy-network
 
  frontend:
    container_name: rebuy-frontend
    build:
      context: ./Rebuy-Frontend
    ports:
      - "3000:80"
 
    # Frontend starts only after backend is healthy
    depends_on:
      backend:
        condition: service_healthy
 
    networks:
      - rebuy-network
 
# ======================================================
# Named volumes (persistence layer)
# ======================================================
volumes:
  backend-logs:
 
# ======================================================
# Dedicated bridge network for inter-service communication
# ======================================================
networks:
  rebuy-network:
    driver: bridge
name: CI/CD Rebuy Project

on:
  push:
    branches:
      - mainCICD
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run backend tests
        working-directory: Rebuy-backend-with-tests
        run: mvn test

name: CI/CD Rebuy Project

on:
  push:
    branches:
      - main
      - mainCICD
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run backend tests
        run: |
          cd Rebuy-backend-with-tests/backend
          mvn test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test-backend
    env:
      IMAGE_NAME: ${{ (secrets.DOCKER_USERNAME || github.repository_owner) }}/rebuy-backend:latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker registry
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Warn if Docker secrets are not set
        if: ${{ secrets.DOCKER_USERNAME == '' }}
        run: |
          echo "WARNING: DOCKER_USERNAME secret is not set. The workflow will still tag images with \"${{ github.repository_owner }}/rebuy-backend:latest\", but pushing to Docker Hub will fail without credentials."

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: Rebuy-backend-with-tests/backend
          file: Rebuy-backend-with-tests/backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}
          platforms: linux/amd64,linux/arm64

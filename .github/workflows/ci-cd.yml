name: CI/CD Rebuy Project

on:
  push:
    branches:
      - main
      - mainCICD
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run backend tests
        run: |
          cd Rebuy-backend-with-tests/backend
          mvn test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker registry
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image name
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "IMAGE_NAME=${GITHUB_REPOSITORY_OWNER}/rebuy-backend:latest" >> $GITHUB_ENV
            echo "WARNING: DOCKER_USERNAME secret is not set. Will tag image as ${GITHUB_REPOSITORY_OWNER}/rebuy-backend:latest (push will fail without credentials)."
          else
            echo "IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/rebuy-backend:latest" >> $GITHUB_ENV
            echo "Using DOCKER_USERNAME for image namespace."
          fi
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: Rebuy-backend-with-tests/backend
          file: Rebuy-backend-with-tests/backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}
          platforms: linux/amd64,linux/arm64

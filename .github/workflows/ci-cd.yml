name: CI/CD Rebuy Project

on:
  push:
    branches:
      - main
      - mainCICD
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run backend tests using Maven Wrapper
        run: |
          cd Rebuy-backend-with-tests/backend
          bash mvnw test

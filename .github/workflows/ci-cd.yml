name: CI/CD Rebuy Project

on:
  push:
    branches:
      - main
      - mainCICD
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run backend tests
        run: |
          cd Rebuy-backend-with-tests/backend
          mvn test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend JAR
        working-directory: Rebuy-backend-with-tests/backend
        run: mvn clean package

      - name: Build backend image
        working-directory: Rebuy-backend-with-tests/backend
        run: docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/rebuy-backend:latest --push .

      - name: Build frontend image
        working-directory: Rebuy-Frontend
        run: docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/rebuy-frontend:latest --push .

# ===== Supabase PostgreSQL via Session Pooler =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
 
# JPA / Hibernate
#Hibernate = the system that converts Java objects to database tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
# HikariCP settings: lower pool size to avoid hitting Supabase pooler limits
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=0
 
# Explicit dialect so Hibernate can start even if metadata is delayed
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Disable Flyway migrations if the production DB cannot run migrations automatically
spring.flyway.enabled=false
 
# Supabase Storage settings (provide these via environment variables or a secrets manager)

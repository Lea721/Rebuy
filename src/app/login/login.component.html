<!-- Login Page -->
<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Login to your Rebuy account</p>
      </div>

      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="submitLogin()">

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" formControlName="email" placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" formControlName="password">
        </div>

        <button type="submit" class="btn-login">Login</button>

        <div class="login-footer">
          <p class="signup-link">
            Don't have an account?
            <a routerLink="/signup" class="link">Sign up</a>
          </p>
        </div>

      </form>
    </div>
  </div>
</div>

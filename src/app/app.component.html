<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <nav class="nav">

        <!-- Brand -->
        <div class="nav-brand">
          <a routerLink="/" class="brand-link">Rebuy</a>
        </div>

        <!-- Centered links -->
        <div class="nav-links">
          <a routerLink="/products" class="nav-link">Products</a>
          <a routerLink="/sell" class="nav-link">Sell</a>
        </div>

        <!-- Right side actions -->
        <div class="nav-actions">

          <!-- User connected -->
          <ng-container *ngIf="user; else guest">
            <span class="nav-user">Hello {{ user.name }} </span>
            <button class="btn-logout" (click)="logout()">Logout</button>
          </ng-container>

          <!-- Guest mode -->
          <ng-template #guest>
            <a routerLink="/login" class="nav-link">Login</a>
            <a routerLink="/signup" class="btn-signup">Sign Up</a>
          </ng-template>

        </div>

      </nav>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main">
    <router-outlet></router-outlet>
  </main>

</div>

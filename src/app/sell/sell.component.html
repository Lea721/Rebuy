<div class="sell-page">
  <div class="container">

    <!-- HEADER -->
    <div class="sell-header">
      <div class="header-icon">🌱</div>
      <h1 class="page-title">Give Your Items a Second Life</h1>
      <p class="page-subtitle">
        List your pre-loved items and help reduce waste while making someone else happy
      </p>
    </div>

    <!-- FORM CARD -->
    <div class="form-container">
      <div class="form-card">

        <div class="form-header">
          <h2 class="form-title">Create Product Listing</h2>
          <p class="form-subtitle">Fill in the details below to list your item for sale</p>
        </div>

        <form class="sell-form" (ngSubmit)="onSubmit()">

          <!-- IMAGE UPLOAD -->
          <div class="form-group">
            <label class="form-label">Product Images (Max 5)</label>

            <div class="image-upload-area">
              <div class="upload-zone" *ngIf="images.length < 5">
                <label class="upload-label">
                  <input type="file"
                         multiple
                         accept="image/*"
                         (change)="onImageSelected($event)"
                         hidden />

                  <span class="upload-icon">📷</span>
                  <p class="upload-text">Click or drag images here</p>
                </label>
              </div>

              <!-- PREVIEW -->
              <div class="image-preview-list">
                <div class="preview-item" *ngFor="let img of images; let i = index">
                  <img [src]="img" />
                  <button type="button" class="delete-btn" (click)="removeImage(i)">✖</button>
                </div>
              </div>
            </div>
          </div>

          <!-- TITLE -->
          <div class="form-group">
            <label class="form-label">Product Title</label>
            <input
              type="text"
              class="form-input"
              placeholder="Enter product title"
              [(ngModel)]="productTitle"
              name="title"
            />
          </div>

          <!-- DESCRIPTION -->
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea
              class="form-textarea"
              placeholder="Describe your item"
              [(ngModel)]="description"
              name="description"
            ></textarea>
          </div>

          <!-- CATEGORY -->
          <div class="form-group">
            <label class="form-label">Category</label>

            <select class="form-select" [(ngModel)]="selectedCategory" name="category">
              <option value="" disabled selected>Select category</option>
              <option *ngFor="let category of categories" [value]="category.id">
                {{ category.name }}
              </option>
            </select>
          </div>

          <!-- CONDITION -->
          <div class="form-group">
            <label class="form-label">Condition</label>

            <select class="form-select" [(ngModel)]="selectedCondition" name="condition">
              <option value="" disabled selected>Select condition</option>
              <option *ngFor="let condition of conditions" [value]="condition.id">
                {{ condition.name }}
              </option>
            </select>
          </div>

          <!-- PRICE -->
          <div class="form-group">
            <label class="form-label">Price ($)</label>
            <input
              type="number"
              class="form-input"
              placeholder="Enter price"
              [(ngModel)]="price"
              name="price"
              min="1"
            />
          </div>

          <!-- SUBMIT -->
          <button
            type="submit"
            class="submit-btn"
          >
            Post Item
          </button>

        </form>
      </div>
    </div>
  </div>
</div>
